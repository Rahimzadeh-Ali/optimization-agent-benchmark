[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-agent-benchmark"
version = "0.1.0"
description = "Function-visible optimization benchmark suite with 30 tasks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
coco = ["coco-experiment==2.8.2"]
cec = ["opfunu==1.0.1"]
constraints = ["pymoo==0.6.1.6"]
nevergrad = ["nevergrad==1.0.12"]
yahpo = ["yahpo-gym==1.0.2", "ConfigSpace<1", "onnxruntime>=1.17"]
optimizers = [
  "cma>=4.0",
  "scikit-optimize>=0.10",
  "Py-BOBYQA>=1.5",
  "torch>=2.2",
  "botorch>=0.12",
]
test = ["pytest>=8", "pytest-cov>=5"]
visualization = ["matplotlib>=3.8"]
full = [
  "coco-experiment==2.8.2",
  "opfunu==1.0.1",
  "pymoo==0.6.1.6",
  "nevergrad==1.0.12",
  "yahpo-gym==1.0.2",
  "ConfigSpace<1",
  "onnxruntime>=1.17",
  "cma>=4.0",
  "scikit-optimize>=0.10",
  "Py-BOBYQA>=1.5",
  "torch>=2.2",
  "botorch>=0.12",
  "pytest>=8",
  "matplotlib>=3.8",
]

[project.scripts]
optbench = "optbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

